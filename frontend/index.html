<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Builder</title>
</head>
<body>

<h1>AI Resume Builder + Job Fit Analyzer</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<textarea id="cv" rows="15" cols="80"></textarea>
<br><br>

<button onclick="match()">Analyze</button>

<hr>

<div id="results"></div>

<h2>Dashboard</h2>
<div id="dashboard"></div>

<button onclick="loadHistory()">
Load History
</button>

<script>
const API = "https://ai-resume-builder-job-fit-analyzer.onrender.com";

async function match() {
    const results = document.getElementById("results");
    const cv = document.getElementById("cv").value;

    results.innerHTML = "Loading...";

    try {
        const response = await fetch(`${API}/match`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ cv: cv })
        });

        const data = await response.json();

        console.log(data);

        results.innerHTML = "";

        data.matches.forEach(job => {
            results.innerHTML += `
                <div style="border:1px solid #ccc; padding:20px; margin:20px;">
                    <h2>${job.title}</h2>
                    <p>${job.company}</p>
                    <p>${job.location}</p>
                    <h3>${job.score}% match</h3>

                    <b>Strengths:</b>
                    <ul>
                        ${job.strengths.map(s => `<li>${s}</li>`).join("")}
                    </ul>

                    <b>Missing:</b>
                    <ul>
                        ${job.missing_skills.map(s => `<li>${s}</li>`).join("")}
                    </ul>
                </div>
            `;
        });

    } catch (error) {
        console.error(error);
        results.innerHTML = "ERROR: " + error;
    }
}

async function register() {
    await fetch(`${API}/register`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            email:email.value,
            password:password.value
        })
    });
    alert("Registered");
}

async function login() {
    const res = await fetch(`${API}/login`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            email:email.value,
            password:password.value
        })
    });

    const data = await res.json();

    localStorage.setItem("token", data.token);

    alert("Logged in");
}

async function loadHistory() {

    const token = localStorage.getItem("token");

    const res = await fetch(
        `${API}/history?token=${token}`
    );

    const data = await res.json();

    dashboard.innerHTML = `
        <h3>${data.email}</h3>
        ${
            data.history.map(h => `
                <div style="
                    border:1px solid #ccc;
                    margin:10px;
                    padding:15px;
                ">
                    <b>${h.job}</b><br>
                    Score: ${h.score}%
                </div>
            `).join("")
        }
    `;
}
</script>
</body>
</html>
