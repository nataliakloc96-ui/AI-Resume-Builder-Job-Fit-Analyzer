<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Builder</title>
</head>
<body>

<h1>AI Resume Builder + Job Fit Analyzer</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<textarea id="cv" rows="15" cols="80"></textarea>
<br><br>

<button onclick="match()">Analyze</button>

<hr>

<div id="results"></div>

<h2>Dashboard</h2>
<div id="dashboard"></div>

<button onclick="loadHistory()">
Load History
</button>

<script>
const API = "https://ai-resume-builder-job-fit-analyzer.onrender.com";

async function match() {

    const cv = document.getElementById("cv").value;

    const res = await fetch(`${API}/match`, {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({ cv })
    });

    const data = await res.json();

    console.log(data);

    if (data.error) {
        results.innerHTML =
            `<h3>ERROR: ${data.error}</h3>`;
        return;
    }

    if (!data.matches) {
        results.innerHTML =
            `<h3>No matches returned</h3>`;
        return;
    }

    results.innerHTML = "";

    data.matches.forEach(job => {

        results.innerHTML += `
            <div style="
                border:1px solid #ccc;
                margin:10px;
                padding:15px;
            ">
                <h3>${job.title}</h3>
                Score: ${job.score}%
            </div>
        `;
    });
}

async function register() {
    await fetch(`${API}/register`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            email:email.value,
            password:password.value
        })
    });
    alert("Registered");
}

async function login() {

    const res = await fetch(`${API}/login`, {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            email: email.value,
            password: password.value
        })
    });

    const data = await res.json();

    console.log(data);

    if (data.error) {
        alert(data.error);
        return;
    }

    localStorage.setItem("token", data.token);

    alert("Logged in");
}

async function loadHistory() {

    const token = localStorage.getItem("token");

    const res = await fetch(
        `${API}/history?token=${token}`
    );

    const data = await res.json();

    if (data.error) {
        dashboard.innerHTML =
            `<h3>Error: ${data.error}</h3>`;
        return;
    }

    if (!data.history) {
        dashboard.innerHTML =
            `<h3>No history found</h3>`;
        return;
    }

    dashboard.innerHTML = `
        <h3>${data.email}</h3>
        ${data.history.map(h => `
            <div style="
                border:1px solid #ccc;
                padding:15px;
                margin:10px;
            ">
                <b>${h.job}</b><br>
                Score: ${h.score}%
            </div>
        `).join("")}
    `;
}
</script>
</body>
</html>
