<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Builder</title>
</head>
<body>

<h1>AI Resume Builder + Job Fit Analyzer</h1>

<textarea id="cv" rows="15" cols="80"></textarea>
<br><br>

<button onclick="match()">Analyze</button>

<hr>

<div id="results"></div>

<script>
const API = "https://ai-resume-builder-job-fit-analyzer.onrender.com";

async function match() {
    const cv = document.getElementById("cv").value;

    const res = await fetch(`${API}/match`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ cv })
    });

    const data = await res.json();

    const results = document.getElementById("results");

    results.innerHTML = data.matches.map(job => `
    <div style="border:1px solid #ccc;padding:20px;margin:20px;">
    <h2>${job.title}</h2>
    <b>${job.company}</b><br>
    ${job.location}

    <h3>Match Score: ${job.score}%</h3>

    <b>Strengths:</b>
    <ul>
        ${job.strengths.map(s => `<li>${s}</li>`).join("")}
    </ul>

    <b>Missing Skills:</b>
    <ul>
        ${job.missing_skills.map(s => `<li>${s}</li>`).join("")}
    </ul>
</div>
`).join("");
}
</script>

</body>
</html>
